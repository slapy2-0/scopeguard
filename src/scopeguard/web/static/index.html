<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScopeGuard Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>ScopeGuard</h1>
  <span class="badge" id="version">…</span>
  <span class="badge" id="status">loading</span>
</header>

<div id="error" class="error hidden"></div>

<section>
  <h2>Authorized Scope</h2>
  <div id="scope-card" class="card"><span class="muted">Loading…</span></div>
</section>

<section>
  <h2>WiFi Scan</h2>
  <div class="row">
    <div>
      <label for="iface">Interface (Linux only)</label>
      <input id="iface" placeholder="wlan0 (ignored on Windows)">
    </div>
    <div>
      <label for="wifi-all">Include out-of-scope</label>
      <select id="wifi-all">
        <option value="false">No (in-scope only)</option>
        <option value="true">Yes (show all, not audited)</option>
      </select>
    </div>
    <div>
      <button data-action id="btn-wifi">Run WiFi scan</button>
    </div>
  </div>
  <div id="wifi-results"></div>
</section>

<section>
  <h2>Network Scan</h2>
  <div class="row">
    <div>
      <label for="cidr">CIDR</label>
      <input id="cidr" placeholder="192.168.1.0/24">
    </div>
    <div>
      <label for="ports">Ports</label>
      <select id="ports">
        <option value="quick">quick</option>
        <option value="common" selected>common</option>
        <option value="extended">extended</option>
      </select>
    </div>
    <div>
      <label for="timeout">Timeout (s)</label>
      <input id="timeout" type="number" step="0.1" min="0.1" value="0.5">
    </div>
    <div>
      <button data-action id="btn-net">Run net scan</button>
    </div>
  </div>
  <div id="net-results"></div>
</section>

<section>
  <h2>Report</h2>
  <div class="toolbar">
    <button data-action id="btn-report-html">Build HTML report</button>
    <button data-action id="btn-report-json">Build JSON report</button>
  </div>
  <p class="muted" style="margin-top:8px">
    Reports use the latest scan results in this browser session.
  </p>
</section>

<script src="/static/app.js"></script>
</body>
</html>
