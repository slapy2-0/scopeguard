[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scopeguard"
version = "0.1.0"
description = "Authorization-first WiFi and network security auditor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
wifi = ["scapy>=2.5"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
scopeguard = "scopeguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scopeguard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"src/scopeguard/web/static" = "scopeguard/web/static"
